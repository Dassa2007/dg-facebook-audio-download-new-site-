<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Video & Audio Downloader</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* ---------- Global Styles ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0a0a2e 0%, #1a1a4e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 40px 30px;
            max-width: 750px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.3s;
        }

        /* ---------- Header ---------- */
        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header i {
            font-size: 52px;
            color: #1877f2;
            background: white;
            padding: 15px;
            border-radius: 50%;
            box-shadow: 0 8px 30px rgba(24, 119, 242, 0.4);
        }

        .header h1 {
            color: #fff;
            font-size: 28px;
            margin-top: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header p {
            color: #b0b3d0;
            font-size: 15px;
            margin-top: 6px;
        }

        /* ---------- Input Section ---------- */
        .input-section {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 28px;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 60px;
            padding: 5px 5px 5px 22px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: 0.3s;
        }

        .input-wrapper:focus-within {
            border-color: #1877f2;
            box-shadow: 0 0 0 4px rgba(24, 119, 242, 0.15);
        }

        .input-wrapper i {
            color: #8a8db0;
            font-size: 18px;
        }

        .input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 16px 14px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .input-wrapper input::placeholder {
            color: #6a6d92;
            font-weight: 300;
        }

        .input-wrapper button {
            background: #1877f2;
            border: none;
            color: white;
            padding: 12px 28px;
            border-radius: 60px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-wrapper button:hover {
            background: #1464d9;
            transform: scale(0.97);
        }

        .input-wrapper button:active {
            transform: scale(0.94);
        }

        .input-wrapper button i {
            color: white;
            font-size: 16px;
        }

        /* ---------- Error Message ---------- */
        #errorMsg {
            color: #ff6b6b;
            font-size: 14px;
            min-height: 24px;
            padding-left: 10px;
        }

        /* ---------- Loading Spinner ---------- */
        .spinner {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 12px;
            color: #b0b3d0;
            font-size: 15px;
            margin: 20px 0 10px;
        }

        .spinner i {
            font-size: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ---------- Result Cards ---------- */
        #result {
            display: none;
            margin-top: 20px;
            animation: fadeUp 0.5s ease;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .video-card {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .video-card .thumbnail {
            width: 100%;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 18px;
            background: #111;
        }

        .video-card .thumbnail img {
            width: 100%;
            height: auto;
            display: block;
        }

        .video-card .title {
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 18px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .download-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 10px;
            border-radius: 14px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.25s;
            text-decoration: none;
            color: white;
            background: rgba(255, 255, 255, 0.08);
        }

        .download-btn i {
            font-size: 16px;
        }

        .download-btn.video-btn {
            background: #1877f2;
        }

        .download-btn.video-btn:hover {
            background: #1464d9;
            transform: translateY(-2px);
        }

        .download-btn.audio-btn {
            background: #8b5cf6;
        }

        .download-btn.audio-btn:hover {
            background: #7c3aed;
            transform: translateY(-2px);
        }

        .download-btn.audio-btn:disabled,
        .download-btn.video-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .no-audio {
            color: #8a8db0;
            font-size: 13px;
            text-align: center;
            padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            grid-column: 1 / -1;
        }

        /* ---------- Footer ---------- */
        .footer {
            margin-top: 30px;
            text-align: center;
            color: #4e5177;
            font-size: 13px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 22px;
        }

        .footer a {
            color: #6a6d92;
            text-decoration: none;
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 500px) {
            .container {
                padding: 28px 16px;
            }
            .input-wrapper {
                flex-wrap: wrap;
                background: transparent;
                padding: 0;
                border: none;
                gap: 10px;
            }
            .input-wrapper input {
                background: rgba(255, 255, 255, 0.07);
                border-radius: 60px;
                padding: 16px 20px;
                border: 1px solid rgba(255, 255, 255, 0.12);
                width: 100%;
            }
            .input-wrapper button {
                width: 100%;
                justify-content: center;
                padding: 16px;
            }
            .download-grid {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 22px;
            }
        }

        @media (min-width: 501px) and (max-width: 700px) {
            .input-wrapper button {
                padding: 12px 18px;
                font-size: 13px;
            }
            .download-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Header -->
    <div class="header">
        <i class="fab fa-facebook"></i>
        <h1>Facebook Downloader</h1>
        <p>Paste any Facebook video URL to download in HD or audio</p>
    </div>

    <!-- Input -->
    <div class="input-section">
        <div class="input-wrapper">
            <i class="fas fa-link"></i>
            <input type="url" id="videoUrl" placeholder="https://www.facebook.com/.../video" required>
            <button id="fetchBtn"><i class="fas fa-download"></i> Get</button>
        </div>
        <div id="errorMsg"></div>
    </div>

    <!-- Loading -->
    <div class="spinner" id="loading">
        <i class="fas fa-circle-notch"></i> Fetching video details...
    </div>

    <!-- Result -->
    <div id="result">
        <div class="video-card">
            <div class="thumbnail">
                <img id="thumbnailImg" src="" alt="Thumbnail">
            </div>
            <div class="title" id="videoTitle">Video Title</div>
            <div class="download-grid" id="downloadButtons">
                <!-- Buttons will be injected here -->
            </div>
        </div>
    </div>

    <div class="footer">
        Powered by <a href="#" target="_blank">Facebook Downloader API</a> &bull; For personal use only
    </div>
</div>

<script>
    // ---------- Configuration ----------
    // ඔබගේ Vercel API Base URL එක මෙතන දාන්න
    const API_BASE = 'https://fb-download-api-new.vercel.app';

    // DOM Elements
    const videoUrlInput = document.getElementById('videoUrl');
    const fetchBtn = document.getElementById('fetchBtn');
    const errorMsg = document.getElementById('errorMsg');
    const loading = document.getElementById('loading');
    const resultDiv = document.getElementById('result');
    const thumbnailImg = document.getElementById('thumbnailImg');
    const videoTitle = document.getElementById('videoTitle');
    const downloadButtons = document.getElementById('downloadButtons');

    // ---------- Helper Functions ----------
    function showError(msg) {
        errorMsg.textContent = msg;
    }

    function clearError() {
        errorMsg.textContent = '';
    }

    function showLoading(show) {
        loading.style.display = show ? 'flex' : 'none';
    }

    function showResult(show) {
        resultDiv.style.display = show ? 'block' : 'none';
    }

    // ---------- Main Fetch Function ----------
    async function fetchVideo() {
        const url = videoUrlInput.value.trim();

        // Validation
        if (!url) {
            showError('Please enter a Facebook video URL');
            return;
        }

        if (!url.includes('facebook.com') && !url.includes('fb.watch')) {
            showError('Please enter a valid Facebook URL');
            return;
        }

        clearError();
        showLoading(true);
        showResult(false);

        try {
            // Call our Vercel API
            const response = await fetch(`${API_BASE}/api/video?url=${encodeURIComponent(url)}`);

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error || 'Failed to fetch video data');
            }

            const data = await response.json();

            if (!data.success) {
                throw new Error(data.error || 'Unknown error occurred');
            }

            // Display result
            renderResult(data);

        } catch (error) {
            console.error('Fetch error:', error);
            showError('Error: ' + error.message);
            showResult(false);
        } finally {
            showLoading(false);
        }
    }

    // ---------- Render Result ----------
    function renderResult(data) {
        // Thumbnail
        if (data.thumbnail) {
            thumbnailImg.src = data.thumbnail;
            thumbnailImg.alt = data.title || 'Video thumbnail';
        } else {
            thumbnailImg.src = ''; // fallback
            thumbnailImg.alt = 'No thumbnail';
        }

        // Title
        videoTitle.textContent = data.title || 'Facebook Video';

        // Download Buttons
        let buttonsHtml = '';

        if (data.qualities && data.qualities.length > 0) {
            // Show video quality buttons
            data.qualities.forEach((q, index) => {
                const label = q.quality || `Quality ${index + 1}`;
                buttonsHtml += `
                    <a href="${q.url}" target="_blank" class="download-btn video-btn" download>
                        <i class="fas fa-video"></i> ${label}
                    </a>
                `;
            });
        } else {
            buttonsHtml += `
                <div class="no-audio">
                    <i class="fas fa-exclamation-circle"></i> No video qualities available
                </div>
            `;
        }

        // Audio button (if available)
        // Note: අපේ API එක audio endpoint එකෙන් URL එක ගන්නවා. 
        // ඒ නිසා අපිට audio URL එක fetch කරන්න වෙනම call එකක් කරන්න වෙනවා.
        // මෙතනදි අපි audio endpoint එකට call කරලා URL එක ගන්නවා.
        // නමුත් simplify කරන්න මෙතනදි අපි ඒක නොකර video data එකේ තියෙන audio එක check කරනවා.
        // අපේ server.js එකේ video endpoint එක audio URL එක return කරන්නේ නැහැ.
        // ඒ නිසා අපි වෙනම audio call එකක් කරන්න ඕනේ.
        // ඒක මෙතනදිම කරමු.

        // Audio button එක එකතු කරන්න අපිට අමතර fetch එකක් කරන්න වෙනවා.
        // ඒක පහලින් තියෙන fetchAudio function එකෙන් කරමු.

        // මුලින් video buttons display කරමු
        downloadButtons.innerHTML = buttonsHtml;

        // ඊට පස්සේ audio එක fetch කරලා button එක add කරමු
        fetchAudioAndAddButton(data);
    }

    // ---------- Fetch Audio URL ----------
    async function fetchAudioAndAddButton(videoData) {
        const url = videoUrlInput.value.trim();

        try {
            const response = await fetch(`${API_BASE}/api/audio?url=${encodeURIComponent(url)}`);
            const data = await response.json();

            if (data.success && data.audioUrl) {
                // Audio available - add audio button
                const audioBtn = document.createElement('a');
                audioBtn.href = data.audioUrl;
                audioBtn.target = '_blank';
                audioBtn.className = 'download-btn audio-btn';
                audioBtn.download = true;
                audioBtn.innerHTML = `<i class="fas fa-music"></i> Audio (MP3)`;
                downloadButtons.appendChild(audioBtn);
            } else {
                // No audio - show message
                const noAudio = document.createElement('div');
                noAudio.className = 'no-audio';
                noAudio.innerHTML = `<i class="fas fa-volume-mute"></i> Audio not available for this video`;
                downloadButtons.appendChild(noAudio);
            }
        } catch (error) {
            console.error('Audio fetch error:', error);
            // Silent fail - just don't show audio button
            const noAudio = document.createElement('div');
            noAudio.className = 'no-audio';
            noAudio.innerHTML = `<i class="fas fa-volume-mute"></i> Audio not available`;
            downloadButtons.appendChild(noAudio);
        }
    }

    // ---------- Event Listeners ----------
    fetchBtn.addEventListener('click', fetchVideo);

    videoUrlInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            fetchVideo();
        }
    });

    // ---------- Auto-fill demo URL (optional) ----------
    // page load එකේදි demo URL එකක් දාන්න ඕනේ නම්:
    // videoUrlInput.value = 'https://www.facebook.com/share/r/1FB3GpnxKC';
</script>
</body>
</html>
