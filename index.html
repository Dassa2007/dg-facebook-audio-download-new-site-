<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FB Downloader - Direct Audio & Video</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <header class="w-full py-6 px-4 text-center border-b border-slate-800">
        <h1 class="text-2xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500">
            <i class="fa-brands fa-facebook text-blue-500 mr-2"></i>FB Downloader
        </h1>
        <p class="text-slate-400 text-sm mt-1">Download Facebook Video & Audio instantly</p>
    </header>

    <main class="flex-grow flex items-center justify-center px-4 py-8">
        <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
            
            <div class="space-y-4">
                <div>
                    <label for="urlInput" class="block text-sm font-medium text-slate-300 mb-2">Facebook Video URL</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
                            <i class="fa-solid fa-link"></i>
                        </span>
                        <input type="text" id="urlInput" placeholder="Paste Facebook link here..." 
                            class="w-full pl-10 pr-4 py-3 bg-slate-950 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-all text-sm">
                    </div>
                </div>

                <button onclick="fetchMedia()" id="downloadBtn" 
                    class="w-full py-3 bg-blue-600 hover:bg-blue-500 active:scale-[0.98] transition-all rounded-xl font-semibold text-white shadow-lg shadow-blue-600/30 flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-download"></i>
                    <span>Fetch Links</span>
                </button>
            </div>

            <div id="loader" class="hidden mt-6 text-center">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent"></div>
                <p class="text-slate-400 text-xs mt-2">Processing link, please wait...</p>
            </div>

            <div id="errorBox" class="hidden mt-6 p-3 bg-red-950/50 border border-red-800 rounded-xl text-red-400 text-xs text-center">
                <i class="fa-solid fa-triangle-exclamation mr-1"></i> <span id="errorText">Could not fetch links.</span>
            </div>

            <div id="resultBox" class="hidden mt-6 p-4 bg-slate-950 border border-slate-800 rounded-xl space-y-4">
                <h3 id="videoTitle" class="text-sm font-semibold text-slate-200 truncate text-center">Facebook Media</h3>
                
                <div class="flex flex-col gap-3">
                    <a id="videoLink" href="#" target="_blank" 
                        class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 transition-all rounded-lg font-medium text-white text-center text-sm flex items-center justify-center space-x-2 shadow-md">
                        <i class="fa-solid fa-file-video"></i>
                        <span>Download Video (HD)</span>
                    </a>

                    <a id="audioLink" href="#" target="_blank" 
                        class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 transition-all rounded-lg font-medium text-white text-center text-sm flex items-center justify-center space-x-2 shadow-md">
                        <i class="fa-solid fa-file-audio"></i>
                        <span>Download Audio (Song)</span>
                    </a>
                </div>
            </div>

        </div>
    </main>

    <footer class="py-4 text-center text-xs text-slate-500 border-t border-slate-900">
        Powered by Direct Web Downloader
    </footer>

    <script>
        async function fetchMedia() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const loader = document.getElementById('loader');
            const errorBox = document.getElementById('errorBox');
            const errorText = document.getElementById('errorText');
            const resultBox = document.getElementById('resultBox');
            const downloadBtn = document.getElementById('downloadBtn');
            
            errorBox.classList.add('hidden');
            resultBox.classList.add('hidden');

            if (!urlInput) {
                errorText.innerText = "Please paste a Facebook video link!";
                errorBox.classList.remove('hidden');
                return;
            }

            loader.classList.remove('hidden');
            downloadBtn.disabled = true;
            downloadBtn.classList.add('opacity-50');

            try {
                // Alok/SnapSave based reliable public endpoints
                const response = await fetch(`https://tikwm.com/api/other/fbdl?url=${encodeURIComponent(urlInput)}`);
                const resData = await response.json();

                loader.classList.add('hidden');
                downloadBtn.disabled = false;
                downloadBtn.classList.remove('opacity-50');

                if (resData && resData.code === 0 && resData.data) {
                    const data = resData.data;
                    document.getElementById('videoTitle').innerText = data.title || "Facebook Video";
                    
                    const mediaUrl = data.url || data.hd;
                    document.getElementById('videoLink').href = mediaUrl;
                    document.getElementById('audioLink').href = mediaUrl; // Video stream works as audio
                    
                    resultBox.classList.remove('hidden');
                } else {
                    throw new Error("API limit or invalid link");
                }
            } catch (err) {
                // Try secondary backup API
                try {
                    const backupRes = await fetch(`https://api.ryzendesu.vip/api/downloader/fbdl?url=${encodeURIComponent(urlInput)}`);
                    const backupData = await backupRes.json();

                    loader.classList.add('hidden');
                    downloadBtn.disabled = false;
                    downloadBtn.classList.remove('opacity-50');

                    if (backupData && (backupData.data || backupData.url)) {
                        const bData = backupData.data || backupData;
                        const finalUrl = bData.hd || bData.url || bData.sd;
                        
                        document.getElementById('videoTitle').innerText = bData.title || "Facebook Media";
                        document.getElementById('videoLink').href = finalUrl;
                        document.getElementById('audioLink').href = finalUrl;
                        
                        resultBox.classList.remove('hidden');
                        return;
                    }
                } catch (e) {}

                loader.classList.add('hidden');
                downloadBtn.disabled = false;
                downloadBtn.classList.remove('opacity-50');
                
                errorText.innerText = "Could not fetch links. Please make sure the video is public.";
                errorBox.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
